# ---------------------------------------------------------------------------
# Continuous Integration — Milestone 10: CI/CD & Release Engineering
#
# ตรวจสอบคุณภาพโค้ดอัตโนมัติทุกครั้งที่ push หรือเปิด/อัปเดต pull request เข้า master หรือ feature/*
# RC2 เพิ่ม PostgreSQL service และรัน migration/integration gate จริง เพื่อป้องกัน migration ที่ validate
# ผ่านแต่ deploy ไม่ได้ รวมถึงตรวจ unique FK, notification dedupe และ assignment state transaction
#
# ทุก step รันตามลำดับในจ็อบเดียว ล้มเหลว step ไหนหยุดทันที (ไม่มี continue-on-error ที่ไหนเลย)
# ---------------------------------------------------------------------------
name: Continuous Integration

on:
  push:
    branches:
      - master
      - 'feature/*'
  pull_request:
    branches:
      - master
      - 'feature/*'

jobs:
  ci:
    name: Test, Build, Lint & Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d appdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/appdb?schema=public'
      RUN_DB_TESTS: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (Active LTS, from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install backend dependencies
        working-directory: apps/api
        run: npm ci

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Validate Prisma schema
        working-directory: apps/api
        run: npm run validate

      - name: Apply database migrations
        working-directory: apps/api
        run: npm run migrate

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npm run generate

      - name: Lint backend
        working-directory: apps/api
        run: npm run lint

      - name: Lint frontend
        working-directory: apps/web
        run: npm run lint

      - name: Test backend
        working-directory: apps/api
        run: npm test

      - name: Build backend (generate Prisma Client)
        working-directory: apps/api
        run: npm run build

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Success summary
        if: success()
        run: |
          echo "## ✅ CI passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All quality checks completed successfully:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Prisma schema validated" >> "$GITHUB_STEP_SUMMARY"
          echo "- PostgreSQL migrations and RC2 integration checks passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend lint passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend lint passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend tests passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend build succeeded (Prisma Client generated)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend build succeeded (Vite production bundle)" >> "$GITHUB_STEP_SUMMARY"
