# ---------------------------------------------------------------------------
# nginx config — Production (RC3: Production Deployment & Operations)
#
# ไฟล์นี้ "ไม่ได้" ถูก build เข้า image (ดู Dockerfile ยังคง COPY nginx.conf ตัวเดิมเสมอ เพื่อไม่ให้
# กระทบ docker-compose.yml ตอน dev) — docker-compose.prod.yml เป็นคน mount ไฟล์นี้ทับ
# /etc/nginx/templates/default.conf.template ตอน container สตาร์ทแทน (ดู docs/DEPLOYMENT.md)
#
# เป็น template เหมือนตัวเดิม — ค่า ${API_UPSTREAM} ถูกแทนตอน container สตาร์ทด้วยกลไก templating
# มาตรฐานของ nginx:alpine image (envsubst อัตโนมัติจาก /etc/nginx/templates/*.template)
#
# เพิ่มจากตัว dev (nginx.conf): gzip, cache header สำหรับ static asset, security header, HSTS,
# proxy timeout ที่ตั้งใจกำหนดชัดเจน, server_tokens off (ซ่อนเลขเวอร์ชัน nginx)
# ---------------------------------------------------------------------------

# ---- Gzip compression — ลดขนาดไฟล์ที่ส่งจริง (JS bundle/CSS/HTML/JSON) ----
# หมายเหตุ: Brotli ไม่ได้เปิดใช้ เพราะ nginx:alpine เวอร์ชันมาตรฐานไม่มี ngx_brotli module ติดมาด้วย
# (ต้อง compile custom image เพิ่ม) — ถือเป็น nice-to-have ที่เว้นไว้ ดู README: Known Limitations
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;

server {
    listen 80;
    server_name _;
    location = /healthz { access_log off; return 200 'ok'; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { access_log off; return 200 'ok'; }

    # ซ่อนเลขเวอร์ชัน nginx จาก response header — ลดข้อมูลที่ผู้โจมตีใช้หา known vulnerability ตามเวอร์ชัน
    server_tokens off;

    # ---- Security headers ----
    # (Helmet ฝั่ง backend ใส่ header พวกนี้ให้ API responses อยู่แล้วตั้งแต่ RC2 — ตรงนี้คือใส่ให้
    # หน้าเว็บ/static asset ที่ nginx เสิร์ฟตรง ๆ ด้วย เพราะ Helmet ไม่ครอบคลุมถึง)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # HSTS มีผลบน TLS listener นี้จริง ไม่ได้ประกาศบน HTTP response
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Static asset caching ----
    # ไฟล์ใน /assets/ ของ Vite build มีชื่อไฟล์ที่ hash เนื้อหาปนอยู่เสมอ (เช่น index-B3Wd1xRA.js) —
    # เปลี่ยนเนื้อหาเมื่อไรชื่อไฟล์เปลี่ยนตาม จึง cache แบบยาวสุด + immutable ได้อย่างปลอดภัย
    #
    # หมายเหตุ (nginx quirk): add_header ไม่ inherit จาก server block ถ้า location นี้มี add_header
    # ของตัวเองอยู่แล้ว (ไม่ว่ากี่ตัวก็ตาม) จึงต้องใส่ security header ซ้ำในนี้ด้วยตรง ๆ ไม่งั้นจะหายไปเงียบ ๆ
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html ต้องไม่ cache เลย — เป็นจุดเดียวที่รู้ว่า build ล่าสุดอ้างอิงไฟล์ asset ชื่ออะไร
    # ถ้า cache ไว้ ผู้ใช้อาจได้ index.html เก่าที่ชี้ไปยัง asset ที่ถูกลบไปแล้วตอน deploy เวอร์ชันใหม่
    # (เหตุผลเดียวกับด้านบน — location นี้มี add_header ของตัวเอง จึงต้องใส่ security header ซ้ำด้วย)
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Swagger UI — backend mount ที่ /docs ตรง ๆ (ไม่ใช่ /api/docs — ดู apps/api/src/index.js:
    # app.use('/docs', ...)) ต้องมี location แยกจาก /api/ เพราะ path ไม่ได้ขึ้นต้นด้วย /api
    location /docs {
        resolver ${NGINX_LOCAL_RESOLVERS} ipv6=off valid=10s;
        set $upstream ${API_UPSTREAM_SCHEME}://${API_UPSTREAM};
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
    }

    # ส่ง request ที่ขึ้นต้นด้วย /api ไปยัง backend
    location /api/ {
        resolver ${NGINX_LOCAL_RESOLVERS} ipv6=off valid=10s;
        set $upstream ${API_UPSTREAM_SCHEME}://${API_UPSTREAM};
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;

        # ---- Proxy timeouts ----
        # ตั้งชัดเจนแทนใช้ default ของ nginx (60s ต่อค่า) — ค่า read สูงกว่าปกติเล็กน้อยเผื่อ export
        # รายงานขนาดใหญ่ (PDF/Excel) ที่ backend ใช้เวลาประมวลผลนานกว่า request ทั่วไป
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # SPA fallback — path อื่น ๆ ให้คืน index.html เสมอ (React เป็นคนจัดการเส้นทางเอง)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
