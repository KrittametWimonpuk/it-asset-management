# ---------------------------------------------------------------------------
# nginx config (เป็น template — ค่า ${API_UPSTREAM} จะถูกแทนตอน container สตาร์ท)
#
# หน้าที่:
#   1) เสิร์ฟไฟล์ static ของ React
#   2) (เฉพาะตอนรันด้วย docker compose) ส่งต่อ /api ไปยัง backend
#
# หมายเหตุ: ตอน deploy บน AWS เราจะให้ "ALB" เป็นคนแยกเส้นทาง /api ไป backend
#          บล็อก location /api ด้านล่างจึงถูกใช้เฉพาะตอนรันบนเครื่องเท่านั้น
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ส่ง request ที่ขึ้นต้นด้วย /api ไปยัง backend
    location /api/ {
        resolver ${NGINX_LOCAL_RESOLVERS} ipv6=off valid=10s;
        set $upstream ${API_UPSTREAM_SCHEME}://${API_UPSTREAM};
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
    }

    # Swagger อยู่ที่ /docs ไม่ได้ขึ้นต้น /api; proxy แยกเพื่อไม่ให้ SPA fallback กลืน route
    location /docs {
        resolver ${NGINX_LOCAL_RESOLVERS} ipv6=off valid=10s;
        set $upstream ${API_UPSTREAM_SCHEME}://${API_UPSTREAM};
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
    }

    # SPA fallback — path อื่น ๆ ให้คืน index.html เสมอ (React เป็นคนจัดการเส้นทางเอง)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
